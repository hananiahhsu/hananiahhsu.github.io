<header class="site-header" role="banner">
  <div class="wrapper header-inner">
    <a class="site-title" rel="author" href="{{ '/' | relative_url }}" aria-label="Hananiah Hsu, home">
      <span class="site-mark" aria-hidden="true">H</span>
      <span class="site-name">Hananiah Hsu</span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      <a class="page-link{% if page.url == '/work/' %} is-current{% endif %}" href="{{ '/work/' | relative_url }}">Work</a>
      <a class="page-link{% if page.url == '/graphics/' %} is-current{% endif %}" href="{{ '/graphics/' | relative_url }}">Geometry</a>
      <a class="page-link{% if page.url == '/math/' %} is-current{% endif %}" href="{{ '/math/' | relative_url }}">Mathematics</a>
      <a class="page-link{% if page.url == '/blog/' or page.layout == 'post' %} is-current{% endif %}" href="{{ '/blog/' | relative_url }}">Journal</a>
      <a class="page-link{% if page.url == '/about/' %} is-current{% endif %}" href="{{ '/about/' | relative_url }}">About</a>
    </nav>
  </div>
</header>
