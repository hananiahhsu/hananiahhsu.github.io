<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#071014">
    <meta name="color-scheme" content="dark">
    {%- seo -%}
    <meta property="og:image" content="{{ '/assets/og-cover.png' | absolute_url }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="{{ '/assets/og-cover.png' | absolute_url }}">
    <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
    {% if page.categories contains "math" or page.url == "/math/" %}
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [["$", "$"], ["\\(", "\\)"]],
          displayMath: [["$$", "$$"], ["\\[", "\\]"]],
          processEscapes: true
        },
        options: {
          skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"]
        }
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    {% endif %}
    {%- feed_meta -%}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    {%- include header.html -%}
    <main class="page-content" id="main-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>
    {%- include footer.html -%}
  </body>
</html>
